<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK上海 6月行事历</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; }
  
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: white;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .header-logo { font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #e8d5a3; }
  .header-title { font-size: 16px; color: #ccc; }
  .header-month { font-size: 36px; font-weight: 700; color: #e8d5a3; }

  .stats-bar {
    background: white;
    padding: 12px 30px;
    display: flex;
    gap: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    flex-wrap: wrap;
  }
  .stat-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .stat-num { font-weight: 700; font-size: 20px; color: #1a1a2e; }
  .stat-label { color: #666; }

  .legend {
    background: white;
    padding: 10px 30px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid #eee;
    align-items: center;
  }
  .legend-title { font-size: 13px; color: #666; font-weight: 600; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

  .calendar-wrap { padding: 20px 30px; }
  .calendar-grid {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #1a1a2e;
  }
  .weekday {
    text-align: center;
    padding: 12px;
    color: #e8d5a3;
    font-size: 13px;
    font-weight: 600;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: #e8e8e8;
  }
  .day-cell {
    background: white;
    min-height: 110px;
    padding: 8px;
    position: relative;
  }
  .day-cell.other-month { background: #fafafa; }
  .day-cell.today { background: #fffbf0; }
  .day-num {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .day-num.sunday { color: #e74c3c; }
  .day-num.saturday { color: #e74c3c; }
  .day-num span.today-badge {
    background: #e8d5a3;
    color: #1a1a2e;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .other-month .day-num { color: #ccc; }

  .activity-tag {
    display: block;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    margin-bottom: 3px;
    cursor: pointer;
    line-height: 1.4;
    word-break: break-all;
    transition: opacity 0.2s;
    color: white;
    font-weight: 500;
  }
  .activity-tag:hover { opacity: 0.85; }

  /* 颜色变量 - 可编辑 */
  .color-group { background: #2ecc71; }      /* 集团/BU活动 - 绿色 */
  .color-region-sh { background: #e67e22; }  /* 上海区域 - 橙色 */
  .color-region-cq { background: #e67e22; }  /* 重庆区域 - 橙色 */
  .color-region-zz { background: #e67e22; }  /* 郑州区域 - 橙色 */
  .color-region-cs { background: #e67e22; }  /* 长沙区域 - 橙色 */
  .color-region-km { background: #e67e22; }  /* 昆明区域 - 橙色 */
  .color-overseas { background: #9b59b6; }   /* 海外（新加坡/香港/东京）- 紫色 */

  /* 弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 30px;
    width: 90%;
    max-width: 520px;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-close {
    position: absolute;
    top: 15px; right: 20px;
    font-size: 24px;
    cursor: pointer;
    color: #666;
    background: none;
    border: none;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; padding-right: 30px; color: #1a1a2e; }
  .modal-field { margin-bottom: 12px; }
  .modal-field label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
  .modal-field input, .modal-field textarea, .modal-field select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .modal-field textarea { height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary { background: #1a1a2e; color: white; }
  .btn-primary:hover { background: #0f3460; }
  .btn-danger { background: #e74c3c; color: white; }
  .btn-secondary { background: #eee; color: #333; }

  .toolbar {
    padding: 10px 30px;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar-btn {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1.5px solid #1a1a2e;
    background: white;
    color: #1a1a2e;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .toolbar-btn:hover { background: #1a1a2e; color: white; }
  .toolbar-btn.primary { background: #1a1a2e; color: white; }
  .toolbar-btn.primary:hover { background: #0f3460; }

  .add-activity-form {
    display: none;
    background: white;
    margin: 0 30px 10px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .add-activity-form.active { display: block; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-field label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .form-field.full { grid-column: 1 / -1; }

  @media (max-width: 768px) {
    .calendar-wrap { padding: 10px; }
    .day-cell { min-height: 80px; padding: 5px; }
    .activity-tag { font-size: 10px; padding: 2px 4px; }
    .header { padding: 15px; }
    .stats-bar { padding: 10px 15px; gap: 15px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">ARK</div>
    <div>
      <div class="header-title">诺亚财富 · 上海行事历</div>
      <div style="font-size:12px;color:#aaa;">可编辑版 · 2026年6月</div>
    </div>
  </div>
  <div class="header-month">2026年6月</div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num" id="totalCount">0</div>
    <div class="stat-label">本月活动总场数</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="totalPeople">0</div>
    <div class="stat-label">可覆盖客户总数</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="cityCount">0</div>
    <div class="stat-label">覆盖城市</div>

</div>

<div class="legend">
  <span class="legend-title">颜色说明：</span>
  <span class="legend-item"><span class="legend-dot" style="background:#2ecc71"></span>集团/BU活动</span>
  <span class="legend-item"><span class="legend-dot" style="background:#e67e22"></span>区域活动</span>
  <span class="legend-item"><span class="legend-dot" style="background:#9b59b6"></span>海外活动</span>
</div>

<div class="toolbar">
  <button class="toolbar-btn primary" onclick="toggleAddForm()">＋ 新增活动</button>
  <button class="toolbar-btn" onclick="exportHTML()">导出可上传版本</button>
  <button class="toolbar-btn" onclick="clearAll()">清空所有活动</button>
</div>

<div class="add-activity-form" id="addForm">
  <div style="font-weight:700;font-size:15px;margin-bottom:14px;">新增活动</div>
  <div class="form-grid">
    <div class="form-field">
      <label>活动名称 *</label>
      <input type="text" id="f-title" placeholder="请输入活动名称">
    </div>
    <div class="form-field">
      <label>日期 *（如：6）</label>
      <input type="number" id="f-day" placeholder="日期" min="1" max="30">
    </div>
    <div class="form-field">
      <label>地点</label>
      <input type="text" id="f-location" placeholder="如：上海">
    </div>
    <div class="form-field">
      <label>可覆盖人数</label>
      <input type="number" id="f-people" placeholder="0" value="0">
    </div>
    <div class="form-field">
      <label>活动类型/颜色</label>
      <select id="f-color">
        <option value="color-group">集团/BU活动（绿色）</option>
        <option value="color-region-sh">上海区域（橙色）</option>
        <option value="color-region-cq">重庆区域（橙色）</option>
        <option value="color-region-zz">郑州区域（橙色）</option>
        <option value="color-region-cs">长沙区域（橙色）</option>
        <option value="color-region-km">昆明区域（橙色）</option>
        <option value="color-overseas">海外活动（紫色）</option>
      </select>
    </div>
    <div class="form-field">
      <label>智慧ID（选填）</label>
      <input type="text" id="f-wisdomid" placeholder="留空可后填">
    </div>
    <div class="form-field full">
      <label>活动简介（选填）</label>
      <textarea id="f-desc" placeholder="留空可后填"></textarea>
    </div>
  </div>
  <div style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end;">
    <button class="btn btn-secondary" onclick="toggleAddForm()">取消</button>
    <button class="btn btn-primary" onclick="addActivity()">确认添加</button>
  </div>
</div>

<div class="calendar-wrap">
  <div class="calendar-grid">
    <div class="weekdays">
      <div class="weekday">日</div>
      <div class="weekday">一</div>
      <div class="weekday">二</div>
      <div class="weekday">三</div>
      <div class="weekday">四</div>
      <div class="weekday">五</div>
      <div class="weekday">六</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-field">
      <label>活动名称</label>
      <input type="text" id="m-title">
    </div>
    <div class="modal-field">
      <label>日期</label>
      <input type="number" id="m-day" min="1" max="30">
    </div>
    <div class="modal-field">
      <label>地点</label>
      <input type="text" id="m-location">
    </div>
    <div class="modal-field">
      <label>可覆盖人数</label>
      <input type="number" id="m-people">
    </div>
    <div class="modal-field">
      <label>活动类型/颜色</label>
      <select id="m-color">
        <option value="color-group">集团/BU活动（绿色）</option>
        <option value="color-region-sh">上海区域（橙色）</option>
        <option value="color-region-cq">重庆区域（橙色）</option>
        <option value="color-region-zz">郑州区域（橙色）</option>
        <option value="color-region-cs">长沙区域（橙色）</option>
        <option value="color-region-km">昆明区域（橙色）</option>
        <option value="color-overseas">海外活动（紫色）</option>
      </select>
    </div>
    <div class="modal-field">
      <label>智慧ID（选填）</label>
      <input type="text" id="m-wisdomid">
    </div>
    <div class="modal-field">
      <label>活动简介（选填）</label>
      <textarea id="m-desc"></textarea>
    </div>
    <div class="modal-field">
      <label>报名状态（选填）</label>
      <select id="m-status">
        <option value="">未设置</option>
        <option value="报名中">报名中</option>
        <option value="已截止">已截止</option>
        <option value="已结束">已结束</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" onclick="deleteActivity()">删除</button>
      <button class="btn btn-primary" onclick="saveActivity()">保存</button>
    </div>
  </div>
</div>

// ============================================================

    people: 0,

  },
  {

  {

    day: 12,
    location: "郑州",
    people: 0,
    color: "color-region-zz",
    wisdomId: "",
    desc: "",
    status: ""
  },
  {
    id: 10,

    day: 12,

  },
  {
    id: 11,

    day: 16,
    dayEnd: 18,
    location: "新加坡",
    people: 0,
    color: "color-overseas",
    wisdomId: "",
    desc: "",
    status: ""
  },
  {
    id: 12,

    day: 25,

    location: "香港",
    people: 0,

  },
  {
    id: 13,
    title: "6月香港签约团",
    day: 26,
    location: "香港",
    people: 0,
    color: "color-overseas",
    wisdomId: "",
    desc: "",
    status: ""
  }
];

var nextId = 14;
var editingId = null;
var year = 2026;
var month = 6; // 6月

// ============================================================
// 日历渲染
// ============================================================
function renderCalendar() {
  var grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  // 2026年6月1日是星期一，getDay()=1
  var firstDay = new Date(year, month - 1, 1).getDay(); // 0=周日
  var daysInMonth = new Date(year, month, 0).getDate(); // 30
  var daysInPrevMonth = new Date(year, month - 1, 0).getDate();
  var today = new Date();

  // 统计数据
  var totalPeople = 0;
  var cities = new Set();
  activities.forEach(function(a) {
    totalPeople += (parseInt(a.people) || 0);
    if (a.location) cities.add(a.location);
  });
  document.getElementById('totalCount').textContent = activities.length;
  document.getElementById('totalPeople').textContent = totalPeople;
  document.getElementById('cityCount').textContent = cities.size;

  // 总格数（6行×7列=42）
  var totalCells = 42;

  for (var i = 0; i < totalCells; i++) {
    var cell = document.createElement('div');
    cell.className = 'day-cell';

    var dayNum = i - firstDay + 1;
    var isCurrentMonth = dayNum >= 1 && dayNum <= daysInMonth;
    var displayDay, displayMonth;

    if (!isCurrentMonth) {
      cell.classList.add('other-month');
      if (dayNum < 1) {
        displayDay = daysInPrevMonth + dayNum;
      } else {
        displayDay = dayNum - daysInMonth;
      }
    } else {
      displayDay = dayNum;
    }

    // 今天高亮
    var isToday = isCurrentMonth &&
      today.getFullYear() === year &&
      today.getMonth() === month - 1 &&
      today.getDate() === dayNum;
    if (isToday) cell.classList.add('today');

    // 日期数字
    var dayNumEl = document.createElement('div');
    var dow = i % 7;
    dayNumEl.className = 'day-num' + (dow === 0 ? ' sunday' : '') + (dow === 6 ? ' saturday' : '');

    if (isToday) {
      dayNumEl.innerHTML = '<span class="today-badge">' + displayDay + '</span>';
    } else {
      dayNumEl.textContent = displayDay;
    }
    cell.appendChild(dayNumEl);

    // 渲染活动标签
    if (isCurrentMonth) {
      activities.forEach(function(a) {
        var show = false;
        if (a.dayEnd) {
          // 跨天活动：每天都显示
          if (dayNum >= a.day && dayNum <= a.dayEnd) show = true;
        } else {
          if (a.day === dayNum) show = true;
        }

        if (show) {
          var tag = document.createElement('span');
          tag.className = 'activity-tag ' + (a.color || 'color-group');

          var label = a.title;
          if (a.dayEnd && dayNum === a.day) label = '▶ ' + label;
          if (a.dayEnd && dayNum === a.dayEnd) label = label + ' ◀';
          if (a.location) label += '【' + a.location + '】';

          tag.textContent = label;
          tag.onclick = function(e) {
            e.stopPropagation();
            openEditModal(a.id);
          };
          cell.appendChild(tag);
        }
      });
    }

    grid.appendChild(cell);
  }
}

// ============================================================
// 新增活动
// ============================================================
function toggleAddForm() {
  var form = document.getElementById('addForm');
  form.classList.toggle('active');
}

function addActivity() {
  var title = document.getElementById('f-title').value.trim();
  var day = parseInt(document.getElementById('f-day').value);
  if (!title || !day) { alert('请填写活动名称和日期'); return; }

  activities.push({
    id: nextId++,
    title: title,
    day: day,
    location: document.getElementById('f-location').value.trim(),
    people: parseInt(document.getElementById('f-people').value) || 0,
    color: document.getElementById('f-color').value,
    wisdomId: document.getElementById('f-wisdomid').value.trim(),
    desc: document.getElementById('f-desc').value.trim(),
    status: ''
  });

  // 清空表单
  ['f-title','f-day','f-location','f-wisdomid','f-desc'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('f-people').value = '0';
  document.getElementById('addForm').classList.remove('active');
  renderCalendar();
}

// ============================================================
// 编辑弹窗
// ============================================================
function openEditModal(id) {
  var a = activities.find(function(x){ return x.id === id; });
  if (!a) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑活动';
  document.getElementById('m-title').value = a.title || '';
  document.getElementById('m-day').value = a.day || '';
  document.getElementById('m-location').value = a.location || '';
  document.getElementById('m-people').value = a.people || 0;
  document.getElementById('m-color').value = a.color || 'color-group';
  document.getElementById('m-wisdomid').value = a.wisdomId || '';
  document.getElementById('m-desc').value = a.desc || '';
  document.getElementById('m-status').value = a.status || '';
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveActivity() {
  var idx = activities.findIndex(function(x){ return x.id === editingId; });
  if (idx === -1) return;
  activities[idx].title = document.getElementById('m-title').value.trim();
  activities[idx].day = parseInt(document.getElementById('m-day').value);
  activities[idx].location = document.getElementById('m-location').value.trim();
  activities[idx].people = parseInt(document.getElementById('m-people').value) || 0;
  activities[idx].color = document.getElementById('m-color').value;
  activities[idx].wisdomId = document.getElementById('m-wisdomid').value.trim();
  activities[idx].desc = document.getElementById('m-desc').value.trim();
  activities[idx].status = document.getElementById('m-status').value;
  closeModal();
  renderCalendar();
}

function deleteActivity() {
  if (!confirm('确定删除这场活动？')) return;
  activities = activities.filter(function(x){ return x.id !== editingId; });
  closeModal();
  renderCalendar();
}

function clearAll() {
  if (!confirm('确定清空所有活动？此操作不可恢复！')) return;
  activities = [];
  renderCalendar();
}

// ============================================================
// 导出 - 数据硬编码进HTML，不依赖LocalStorage
// ============================================================
function exportHTML() {
  var dataScript = '<script id="__data__">\nvar activities = ' +
    JSON.stringify(activities, null, 2) +
    ';\nvar nextId = ' + nextId + ';\n<\/script>';

  var html = document.documentElement.outerHTML;

  // 替换或插入数据脚本
  if (html.indexOf('id="__data__"') !== -1) {
    html = html.replace(/<script id="__data__">[\s\S]*?<\/script>/, dataScript);
  } else {
    html = html.replace('</body>', dataScript + '\n</body>');
  }

  // 清除所有 base64 图片（压缩体积）
  html = html.replace(/src="data:image\/[^"]{50,}"/g, 'src=""');
  html = html.replace(/url\(data:image\/[^)]{50,}\)/g, 'url()');

  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// 初始化
// ============================================================
renderCalendar();
</script>
</body>
</html>
